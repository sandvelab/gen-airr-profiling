tuning:
  - tuning_method: "reduced_dimensionality"
    model_names: [ "VAE01", "VAE02", "VAE03", "VAE04", "VAE05", "VAE06", "VAE07", "VAE08",
                   "VAE09", "VAE10", "VAE11", "VAE12", "VAE13", "VAE14", "VAE15", "VAE16",
                   "VAE17", "VAE18", "VAE19", "VAE20", "VAE21", "VAE22", "VAE23", "VAE24" ]
    reference_data: [ "train", "test" ]
    subfolder_name: "all VAE models"
    hyperparameter_table_path: "data/hyperparameter_tables/VAE.tsv"
  - tuning_method: "overlap"
    model_names: [ "VAE01", "VAE02", "VAE03", "VAE04", "VAE05", "VAE06", "VAE07", "VAE08",
                   "VAE09", "VAE10", "VAE11", "VAE12", "VAE13", "VAE14", "VAE15", "VAE16",
                   "VAE17", "VAE18", "VAE19", "VAE20", "VAE21", "VAE22", "VAE23", "VAE24" ]
    reference_data: [ "train", "test" ]
    k_values: [ 0.001, 0.005, 0.01, 0.05, 0.1, 0.3, 0.5, 0.7, 1.0 ]
    subfolder_name: "all VAE models"
    hyperparameter_table_path: "data/hyperparameter_tables/VAE.tsv"
