# Copies the Akbar_overlap EXP1 runs left on CPU (exp_0-77) after the CPU pipeline was stopped.
# Only run once none of these jobs is running any more: a finished immuneML run is copied, but an
# unfinished one is removed and sampled again. Already copied jobs are skipped.
n_experiments: 100
output_dir: "RESULTS_SEP25/EMERSON_EXP1"
input_dir: "data/experimental/emerson_exp1"
seed: 42

sampling:
  - model_name: "Akbar_overlap"
    experiment_names: ["exp_0", "exp_1", "exp_2", "exp_3", "exp_4", "exp_5", "exp_6", "exp_7", "exp_8", "exp_9", "exp_10", "exp_11", "exp_12", "exp_13", "exp_14", "exp_15", "exp_16", "exp_17", "exp_18", "exp_19", "exp_20", "exp_21", "exp_22", "exp_23", "exp_24", "exp_25", "exp_26", "exp_27", "exp_28", "exp_29", "exp_30", "exp_31", "exp_32", "exp_33", "exp_34", "exp_35", "exp_36", "exp_37", "exp_38", "exp_39", "exp_40", "exp_41", "exp_42", "exp_43", "exp_44", "exp_45", "exp_46", "exp_47", "exp_48", "exp_49", "exp_50", "exp_51", "exp_52", "exp_53", "exp_54", "exp_55", "exp_56", "exp_57", "exp_58", "exp_59", "exp_60", "exp_61", "exp_62", "exp_63", "exp_64", "exp_65", "exp_66", "exp_67", "exp_68", "exp_69", "exp_70", "exp_71", "exp_72", "exp_73", "exp_74", "exp_75", "exp_76", "exp_77"]
