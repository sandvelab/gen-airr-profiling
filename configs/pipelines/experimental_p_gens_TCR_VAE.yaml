# Computes only the p_gens of the train and test sequences (n_samples: 0). The sequences of these
# models were already sampled with experimental_resampling_TCR_VAE.yaml and are not changed.
n_experiments: 11
output_dir: "RESULTS_SEP25/TCR"
input_dir: "data/experimental/collectionA"
seed: 42

sampling:
  - model_name: "VAE_overlap"
    experiment_names: ["exp_0", "exp_1", "exp_2", "exp_3", "exp_4", "exp_5", "exp_6", "exp_7", "exp_8", "exp_9", "exp_10"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 0
    compute_p_gens: True
    model_overrides:
      iter_count_prob_estimation: 500
  - model_name: "VAE_kmer"
    experiment_names: ["exp_0", "exp_1", "exp_2", "exp_3", "exp_4", "exp_5", "exp_6", "exp_7", "exp_8", "exp_9", "exp_10"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 0
    compute_p_gens: True
    model_overrides:
      iter_count_prob_estimation: 500
