# Akbar EXP1 resampling on GPU for the jobs that had not started when the CPU run
# (experimental_resampling_EMERSON_EXP1_Akbar.yaml) was stopped; part 1 of 2: Akbar_overlap exp_64-99 and Akbar_kmer exp_0-31.
n_experiments: 100
output_dir: "RESULTS_SEP25/EMERSON_EXP1"
input_dir: "data/experimental/emerson_exp1"
seed: 42

sampling:
  - model_name: "Akbar_overlap"
    experiment_names: ["exp_64", "exp_65", "exp_66", "exp_67", "exp_68", "exp_69", "exp_70", "exp_71", "exp_72", "exp_73", "exp_74", "exp_75", "exp_76", "exp_77", "exp_78", "exp_79", "exp_80", "exp_81", "exp_82", "exp_83", "exp_84", "exp_85", "exp_86", "exp_87", "exp_88", "exp_89", "exp_90", "exp_91", "exp_92", "exp_93", "exp_94", "exp_95", "exp_96", "exp_97", "exp_98", "exp_99"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 500000
    compute_p_gens: True
    device: "cuda"
  - model_name: "Akbar_kmer"
    experiment_names: ["exp_0", "exp_1", "exp_2", "exp_3", "exp_4", "exp_5", "exp_6", "exp_7", "exp_8", "exp_9", "exp_10", "exp_11", "exp_12", "exp_13", "exp_14", "exp_15", "exp_16", "exp_17", "exp_18", "exp_19", "exp_20", "exp_21", "exp_22", "exp_23", "exp_24", "exp_25", "exp_26", "exp_27", "exp_28", "exp_29", "exp_30", "exp_31"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 500000
    compute_p_gens: True
    device: "cuda"
