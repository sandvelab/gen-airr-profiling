n_experiments: 6
output_dir: "RESULTS_SEP25/UMI"
input_dir: "data/experimental/collectionC"
seed: 42

analyses:
    - name: "clone_frequencies"
      model_names: [ "PWM", "VAE_kmer", "SoNNia_kmer", "Akbar_kmer", "Saka_kmer", "ProGen_kmer", "TCRpeg_kmer" ]
      default_model_name: "humanIGH"
      reference_data: [ "train", "test" ]
      n_subsets: 3
      subfolder_name: "all models"
      receptor_type: "BCR UMI"
      statistical_tests: False
      donor_pattern: "^[^_]+_([^_]+)_"
