# Computes only the p_gens of the train and test sequences (n_samples: 0). The sequences of these
# models were already sampled with experimental_resampling_BCR_ProGen.yaml and are not changed.
n_experiments: 7
output_dir: "RESULTS_SEP25/BCR"
input_dir: "data/experimental/collectionB"
seed: 42

sampling:
  - model_name: "ProGen_overlap"
    experiment_names: ["exp_0", "exp_1", "exp_2", "exp_3", "exp_4", "exp_5", "exp_6"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 0
    compute_p_gens: True
    device: "cuda"
  - model_name: "ProGen_kmer"
    experiment_names: ["exp_0", "exp_1", "exp_2", "exp_3", "exp_4", "exp_5", "exp_6"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 0
    compute_p_gens: True
    device: "cuda"
