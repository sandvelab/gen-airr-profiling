# Akbar_kmer EXP1 resampling on GPU, exp_0-49 (part 1 of 2). The CPU run
# (experimental_resampling_EMERSON_EXP1_Akbar.yaml) has to be stopped before it starts Akbar_kmer.
n_experiments: 100
output_dir: "RESULTS_SEP25/EMERSON_EXP1"
input_dir: "data/experimental/emerson_exp1"
seed: 42

sampling:
  - model_name: "Akbar_kmer"
    experiment_names: ["exp_0", "exp_1", "exp_2", "exp_3", "exp_4", "exp_5", "exp_6", "exp_7", "exp_8", "exp_9", "exp_10", "exp_11", "exp_12", "exp_13", "exp_14", "exp_15", "exp_16", "exp_17", "exp_18", "exp_19", "exp_20", "exp_21", "exp_22", "exp_23", "exp_24", "exp_25", "exp_26", "exp_27", "exp_28", "exp_29", "exp_30", "exp_31", "exp_32", "exp_33", "exp_34", "exp_35", "exp_36", "exp_37", "exp_38", "exp_39", "exp_40", "exp_41", "exp_42", "exp_43", "exp_44", "exp_45", "exp_46", "exp_47", "exp_48", "exp_49"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 500000
    compute_p_gens: True
    device: "cuda"
