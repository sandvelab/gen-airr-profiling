# Akbar_kmer EXP1 resampling on GPU, exp_50-99 (part 2 of 2). The CPU run
# (experimental_resampling_EMERSON_EXP1_Akbar.yaml) has to be stopped before it starts Akbar_kmer.
n_experiments: 100
output_dir: "RESULTS_SEP25/EMERSON_EXP1"
input_dir: "data/experimental/emerson_exp1"
seed: 42

sampling:
  - model_name: "Akbar_kmer"
    experiment_names: ["exp_50", "exp_51", "exp_52", "exp_53", "exp_54", "exp_55", "exp_56", "exp_57", "exp_58", "exp_59", "exp_60", "exp_61", "exp_62", "exp_63", "exp_64", "exp_65", "exp_66", "exp_67", "exp_68", "exp_69", "exp_70", "exp_71", "exp_72", "exp_73", "exp_74", "exp_75", "exp_76", "exp_77", "exp_78", "exp_79", "exp_80", "exp_81", "exp_82", "exp_83", "exp_84", "exp_85", "exp_86", "exp_87", "exp_88", "exp_89", "exp_90", "exp_91", "exp_92", "exp_93", "exp_94", "exp_95", "exp_96", "exp_97", "exp_98", "exp_99"]
    immuneml_config: "configs/pipelines/experimental_sampling_immuneml.yaml"
    n_samples: 500000
    compute_p_gens: True
    device: "cuda"
